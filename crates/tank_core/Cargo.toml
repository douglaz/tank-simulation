[package]
name = "tank_core"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"

[dev-dependencies]
proptest = "1"
tank_scenarios = { path = "../tank_scenarios" }
