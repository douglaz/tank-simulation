notes = """
Mineral-rich, well-buffered profile emulating Sulawesi-type or high-KH tap \
water for Neocaridina husbandry. GH ~9.3, KH ~8.0, TDS ~285. \
Equilibrium pH ~7.7 (range 7.5-8.0). Alkalinity 2.86 meq/L provides the \
strongest buffering of the shipped profiles — essential for shrimp \
husbandry scenarios where pH stability supports both nitrification and \
molt success. High DIC (35.7 mg C/L) keeps HCO3- dominant, resisting pH \
swings from respiration or nitrification. Higher Ca/Mg supports \
shell/exoskeleton formation. 8 mg N/L nitrate and 0.15 mg P/L phosphate \
reflect remineralized tap water."""
