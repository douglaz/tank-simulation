notes = """
Balanced general-purpose freshwater profile emulating typical treated \
municipal tap water. GH ~5.8, KH ~4.0, TDS ~171. Equilibrium pH ~7.2 \
(range 7.0-7.5). Alkalinity 1.43 meq/L provides moderate buffering — \
better than soft_acidic but still exhaustible under heavy nitrification \
load (each mg N nitrified costs ~0.14 meq). Starts with 5 mg N/L nitrate \
and 0.1 mg P/L phosphate, reflecting typical municipal water. The \
warm_room scenario uses this profile and maintains a visible nitrate \
floor from water changes."""
