notes = """
Balanced community-tank water modeled after a typical treated municipal tap. \
GH ~5.8, KH ~4.0, and moderate DIC keep the carbonate preview in the pH \
7.0-7.5 band: clearly buffered, but still exhaustible under sustained \
nitrification load. The preset carries 5 mg N/L nitrate and 0.1 mg P/L \
phosphate to emulate a light nutrient floor from incoming water. \
Post-normalization (6e5.2.6) the medium_planted and warm_room scenarios \
use this profile as their default tap-water baseline."""
