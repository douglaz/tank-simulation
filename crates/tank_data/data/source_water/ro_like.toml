notes = """
Lightly remineralized RO/DI water for keepers who add GH salts but almost no \
carbonate buffer. GH ~4.0, KH ~0.1, and minimal DIC place the carbonate \
preview around pH 6.2 with very poor buffering, so water changes with this \
preset dilute alkalinity aggressively without pretending the source is \
literally ion-free. Use it when the gameplay story should be "clean but easy \
to destabilize," not as a zero-everything regression fixture."""
