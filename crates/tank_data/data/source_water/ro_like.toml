notes = """
Remineralized RO/DI water with minimal buffering capacity. GH ~3.5, \
KH ~0.1, TDS ~34. Equilibrium pH ~6.1 (range 5.5-6.5). Trace DIC \
(1.2 mg C/L) represents atmospheric CO2 absorption; near-zero \
alkalinity (0.036 meq/L) means virtually no buffering — any \
nitrification will crash pH rapidly. Ca/Mg from a typical GH \
remineralizer (Salty Shrimp-style) provides mineral support for \
shrimp molting without adding KH. This is the most pH-sensitive \
of the shipped profiles, useful for demonstrating the importance \
of carbonate buffering."""
