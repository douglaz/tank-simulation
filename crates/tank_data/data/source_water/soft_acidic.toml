notes = """
Soft acidic freshwater modeled after blackwater-influenced tap or low-KH \
community water. GH ~3.1, KH ~2.5, and lower DIC keep the carbonate preview \
in the pH 6.5-7.0 band, so nitrification can pull pH down noticeably as the \
small buffer reserve is consumed. Zero initial nitrogen species means all TAN \
in cycling scenarios comes from feed decomposition. This remains the default \
for the nano_cycle scenario because it teaches the soft-water buffering story \
without collapsing straight to the solver floor."""
