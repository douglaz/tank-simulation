notes = """
Low-mineral planted tank source water. GH ~3.0, KH ~3.0, TDS ~120. \
Alkalinity 1.07 meq/L provides limited buffering: the nano_cycle scenario \
demonstrates pH depression and nitrification stalls as alkalinity is \
consumed (each mg N nitrified costs ~0.14 meq). Zero initial nitrogen \
species means all TAN in cycling scenarios comes from feed decomposition. \
Post-normalization (6e5.2.6) this profile still produces the expected \
"soft water = poor cycling buffer" story."""
