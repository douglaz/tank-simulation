notes = """
Low-mineral, weakly-buffered source water emulating blackwater or soft \
Asian tap water for planted tanks. GH ~3.1, KH ~2.0, TDS ~101. \
Equilibrium pH ~6.75 (range 6.5-7.0). Alkalinity 0.71 meq/L provides \
limited buffering: the nano_cycle scenario demonstrates pH depression \
and nitrification stalls as alkalinity is consumed (each mg N nitrified \
costs ~0.14 meq). Low DIC (12.1 mg C/L) means CO2 fraction is higher \
relative to HCO3-, making pH more sensitive to biological activity. \
Zero initial nitrogen species means all TAN in cycling scenarios comes \
from feed decomposition."""
